<main class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/home" aria-label="Foodie home"><span class="brand-mark">⌁</span><span>Foodie</span></a>
    <p class="sidebar-tagline">Eat well. Live well.</p>
    <nav class="sidebar-nav" aria-label="Main navigation">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><span>⌂</span>Home</a>
      <a routerLink="/search" routerLinkActive="active"><span>⌕</span>Search</a>
      <a routerLink="/favorites" routerLinkActive="active"><span>♡</span>Favorites</a>
      <a routerLink="/profile" routerLinkActive="active"><span>♙</span>Profile</a>
    </nav>
  </aside>

  <section class="main-content">
    <header class="topbar">
      <a class="mobile-brand brand" routerLink="/home" aria-label="Foodie home"><span class="brand-mark">⌁</span><span>Foodie</span></a>
      <div class="top-actions">
        <button class="icon-button" aria-label="Notifications">♧<span class="notification-dot"></span></button>
        <a class="profile-button" routerLink="/profile" aria-label="Open profile">👩🏻</a>
      </div>
    </header>

    <p class="tagline">Eat well. Live well.</p>
    <router-outlet></router-outlet>
    <button class="add-button" routerLink="/add" aria-label="Add a recipe">+</button>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><span>⌂</span>Home</a>
      <a routerLink="/search" routerLinkActive="active"><span>⌕</span>Search</a>
      <a class="nav-spacer" aria-hidden="true"></a>
      <a routerLink="/favorites" routerLinkActive="active"><span>♡</span>Favorites</a>
      <a routerLink="/profile" routerLinkActive="active"><span>♙</span>Profile</a>
    </nav>
  </section>
</main>
