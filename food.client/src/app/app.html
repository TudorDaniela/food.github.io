<main class="app-shell">
  <header class="topbar">
    <a class="brand" href="#" aria-label="Foodie home">
      <span class="brand-mark">⌁</span>
      <span>Foodie</span>
    </a>
    <div class="top-actions">
      <button class="icon-button" aria-label="Notifications">♧<span class="notification-dot"></span></button>
      <button class="profile-button" aria-label="Open profile">👩🏻</button>
    </div>
  </header>

  <p class="tagline">Eat well. Live well.</p>

  <section class="welcome">
    <h1>Hello, Dana! <span aria-label="waving hand">👋</span></h1>
    <p>What are you in the mood for?</p>
  </section>

  <div class="search-row">
    <label class="search-box">
      <span aria-hidden="true">⌕</span>
      <input type="search" placeholder="Search recipes, ingredients..." aria-label="Search recipes and ingredients">
    </label>
    <button class="filter-button" aria-label="Filter recipes">☷</button>
  </div>

  <nav class="category-list" aria-label="Recipe categories">
    <button *ngFor="let category of categories; let first = first" [class.selected]="first">{{ category }}</button>
  </nav>

  <section class="recipe-section">
    <div class="section-heading">
      <h2>Popular for you</h2>
      <a href="#popular">See all</a>
    </div>
    <div class="recipe-grid" id="popular">
      <article class="recipe-card" *ngFor="let recipe of popularRecipes">
        <div class="image-wrap">
          <img [src]="recipe.image" [alt]="recipe.name">
          <button class="favorite-button" aria-label="Save recipe">♡</button>
        </div>
        <h3>{{ recipe.name }}</h3>
        <div class="recipe-meta"><span>◷ {{ recipe.time }}</span><span>★ {{ recipe.rating }}</span></div>
      </article>
    </div>
  </section>

  <section class="recipe-section liked-section">
    <div class="section-heading">
      <h2>Because you liked Salads</h2>
      <a href="#salads">See all</a>
    </div>
    <div class="recipe-grid" id="salads">
      <article class="recipe-card" *ngFor="let recipe of saladRecipes">
        <div class="image-wrap">
          <img [src]="recipe.image" [alt]="recipe.name">
          <button class="favorite-button" aria-label="Save recipe">♡</button>
        </div>
        <h3>{{ recipe.name }}</h3>
        <div class="recipe-meta"><span>◷ {{ recipe.time }}</span><span>★ {{ recipe.rating }}</span></div>
      </article>
    </div>
  </section>

  <button class="add-button" aria-label="Add a recipe">+</button>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="active" href="#home"><span>⌂</span>Home</a>
    <a href="#search"><span>⌕</span>Search</a>
    <a class="nav-spacer" aria-hidden="true"></a>
    <a href="#favorites"><span>♡</span>Favorites</a>
    <a href="#profile"><span>♙</span>Profile</a>
  </nav>
</main>
