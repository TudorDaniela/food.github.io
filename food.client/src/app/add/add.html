<section class="screen-content"><h1>Add a recipe</h1><p class="intro">Share something delicious with the Foodie community.</p><form (submit)="saveRecipe(); $event.preventDefault()"><label>Recipe name<input type="text" placeholder="e.g. Summer pasta" required></label><label>Category<select><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label><label>Short description<textarea rows="4" placeholder="Tell us about this recipe..."></textarea></label><button class="save-button" type="submit">Save recipe</button></form>@if (submitted) {
<p class="success">Your recipe is ready to be added!</p>
}</section>
