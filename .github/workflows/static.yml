name: Deploy static content to Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: food.client/package-lock.json

      - name: Install dependencies
        run: cd food.client && npm ci

      - name: Build Angular
        run: cd food.client && npm run build -- --base-href=/food.github.io/

      - name: Build Food.Server
        run: dotnet build ./Food.Server/Food.Server.csproj --configuration Release

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./food.client/dist/food.client/browser
      
      - name: Run unit tests
        run: dotnet test ./Food.Server.UnitTests/Food.Server.UnitTests.csproj --configuration Release

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
